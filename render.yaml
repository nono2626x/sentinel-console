services:
  - type: web
    name: sentinel-console
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AGENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PANEL_PASS
        sync: false
